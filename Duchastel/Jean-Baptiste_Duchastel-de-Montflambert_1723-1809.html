<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jean-Baptiste Duchastel de Montflambert (1723-1809)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e7; --paper:#fffdf8; --ink:#2a2420; --muted:#6d6257;
    --accent:#7a1f2b; --accent-2:#b08d4f; --line:#e3d9c6; --navy:#1f2c44;
    --hl:#f3ead7;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Lora',Georgia,serif;font-size:17px;line-height:1.7}
  a{color:var(--accent);text-underline-offset:3px}
  a:hover{color:var(--navy)}
  .wrap{max-width:900px;margin:0 auto;padding:0 20px}

  /* nav */
  .topnav{background:var(--navy);color:#e9e2d2;font-size:14px}
  .topnav .wrap{display:flex;flex-wrap:wrap;gap:6px 22px;padding:12px 20px}
  .topnav a{color:#e9e2d2;text-decoration:none;border-bottom:1px solid transparent}
  .topnav a:hover{border-bottom-color:var(--accent-2);color:#fff}

  /* hero */
  .hero{background:linear-gradient(160deg,#1f2c44 0%,#2d1a22 100%);color:#f4ecda;padding:64px 0 56px;text-align:center;border-bottom:4px solid var(--accent-2)}
  .hero .gen{letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:var(--accent-2);margin:0 0 14px}
  .hero h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(34px,6vw,58px);line-height:1.1;margin:0 0 10px}
  .hero .dates{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(22px,3.5vw,30px);color:var(--accent-2);margin:0 0 14px}
  .hero .sub{font-style:italic;color:#d8cdb4;margin:0}

  main{padding:36px 0 60px}
  section{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:30px 34px;margin:0 0 26px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
  h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;line-height:1.2;margin:0 0 16px;color:var(--navy);display:flex;gap:14px;align-items:baseline}
  h2 .num{font-size:20px;color:var(--accent-2);font-weight:700;min-width:30px}
  h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;margin:26px 0 8px;color:var(--accent)}
  p{margin:0 0 14px}

  /* identity card */
  .identity{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:6px 0 0}
  .identity div{padding:12px 16px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
  .identity div:nth-child(2n){border-right:0}
  .identity div:nth-last-child(-n+2){border-bottom:0}
  .identity dt{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
  .identity dd{margin:0;font-size:16px;line-height:1.45}
  .identity .full{grid-column:1/-1;border-right:0}

  .highlight{background:var(--hl);border-left:4px solid var(--accent);padding:16px 20px;margin:18px 0;border-radius:0 6px 6px 0}
  .highlight p:last-child{margin-bottom:0}
  .note{font-size:14.5px;color:var(--muted)}

  /* tree */
  .tree{display:flex;flex-direction:column;align-items:center;gap:0;margin:22px 0 6px;font-size:15px}
  .node{background:#fff;border:1.5px solid var(--navy);border-radius:6px;padding:10px 16px;text-align:center;min-width:230px;max-width:100%}
  .node small{display:block;color:var(--muted);font-size:13px}
  .node.main{background:var(--navy);color:#fff;border-color:var(--navy)}
  .node.main small{color:#cfc6b0}
  .node.sp{border-style:dashed;border-color:var(--accent-2)}
  .vline{width:2px;height:20px;background:var(--navy)}
  .row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .hbar{width:min(360px,70%);height:2px;background:var(--navy)}
  .couple{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  .couple .amp{color:var(--accent);font-size:22px}

  /* sales */
  .figures{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 22px}
  .fig{border:1px solid var(--line);border-radius:6px;padding:14px 16px;background:#fff;text-align:center}
  .fig b{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;color:var(--accent);line-height:1.15}
  .fig span{font-size:13.5px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:15.5px;margin:10px 0 6px}
  th{background:var(--navy);color:#f4ecda;text-align:left;font-weight:500;padding:10px 12px;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  td.r,th.r{text-align:right;white-space:nowrap}
  tfoot td{font-weight:600;background:var(--hl);border-bottom:0}
  .bar{height:8px;background:var(--line);border-radius:4px;margin-top:6px;min-width:90px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}

  .timeline{list-style:none;margin:18px 0 0;padding:0 0 0 22px;border-left:2px solid var(--accent-2)}
  .timeline li{position:relative;margin:0 0 16px;padding-left:6px}
  .timeline li::before{content:"";position:absolute;left:-30px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--accent)}
  .timeline .d{font-weight:600;color:var(--navy)}

  .kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:10px}
  .kid{border:1px solid var(--line);border-radius:6px;padding:16px 18px;background:#fff}
  .kid h3{margin:0 0 6px;font-size:22px}
  .kid p{margin:0 0 8px;font-size:15.5px}

  .buyers h3{font-size:21px;margin-top:20px}
  ul.src{padding-left:20px;margin:6px 0 14px;font-size:14.5px}
  ul.src li{margin-bottom:5px;overflow-wrap:anywhere}
  .srcgroup{margin-top:22px;padding-top:6px;border-top:1px dashed var(--line)}
  .srcgroup h3{font-size:20px;margin-top:12px}

  footer{background:var(--navy);color:#cfc6b0;text-align:center;padding:26px 20px;font-size:14px}
  footer a{color:#e9e2d2}

  @media (max-width:700px){
    body{font-size:16px}
    section{padding:22px 18px}
    h2{font-size:27px}
    .identity{grid-template-columns:1fr}
    .identity div{border-right:0}
    .identity div:nth-last-child(-n+2){border-bottom:1px solid var(--line)}
    .identity div:last-child{border-bottom:0}
    .figures{grid-template-columns:1fr}
    table,thead,tbody,tfoot,tr,td{display:block}
    thead{display:none}
    tr{border:1px solid var(--line);border-radius:6px;margin-bottom:12px;padding:6px 4px;background:#fff}
    td{border:0;padding:5px 10px;text-align:left!important}
    td[data-l]::before{content:attr(data-l) " : ";font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
    tfoot tr{background:var(--hl)}
  }
  /* images */
  .fig-img{margin:16px 0;text-align:center}
  .fig-img img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:#fff}
  .fig-img figcaption{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.45}
  .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:16px 0}
  .gallery.two{grid-template-columns:repeat(auto
